syntax = "proto3";

package dssd.region.v1;

// ShardRaft carries Raft's RequestVote/AppendEntries for one specific
// shard's leader election, tagged by shard_id so a single gRPC server
// can dispatch to the right Raft instance among many hosted per node.
service ShardRaft {
  rpc RequestVote(ShardVoteRequest) returns (ShardVoteReply);
  rpc AppendEntries(ShardAppendRequest) returns (ShardAppendReply);
}

message ShardVoteRequest {
  string shard_id = 1;
  uint64 term = 2;
  string candidate_id = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
}

message ShardVoteReply {
  uint64 term = 1;
  bool vote_granted = 2;
}

message ShardLogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes command = 3;
}

message ShardAppendRequest {
  string shard_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated ShardLogEntry entries = 6;
  uint64 leader_commit = 7;
}

message ShardAppendReply {
  uint64 term = 1;
  bool success = 2;
}

// RegionOwner is the client-facing API for cross-shard agent hand-off:
// the current owner (leader) of a shard calls this on the destination
// shard's current owner to transfer an agent crossing the boundary.
service RegionOwner {
  rpc HandOff(HandOffRequest) returns (HandOffResponse);
}

message AgentState {
  string id = 1;
  float x = 2;
  float y = 3;
  float vx = 4;
  float vy = 5;
}

message HandOffRequest {
  string shard_id = 1; // destination shard
  uint64 term = 2;     // destination leader's term, as the sender believes it - fences stale hand-offs
  AgentState agent = 3;
}

message HandOffResponse {
  bool accepted = 1;
  string reason = 2;
}
