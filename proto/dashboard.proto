syntax = "proto3";

package dssd.dashboard.v1;

// WorkerStatus lets external tooling (the live dashboard) read a
// worker's training progress without scraping logs. Every worker hosts
// this, not just the current leader.
service WorkerStatus {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string worker_id = 1;
  uint64 round = 2;
  float loss = 3;
  bool has_loss = 4; // false until the worker's first inner-loop pass completes
}
