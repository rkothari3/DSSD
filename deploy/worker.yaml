apiVersion: v1
kind: Service
metadata:
  name: workers
spec:
  clusterIP: None
  selector:
    app: dssd-worker
  ports:
    - name: grpc
      port: 8000
    - name: swim
      port: 8001
      protocol: UDP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
spec:
  serviceName: workers
  replicas: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: dssd-worker
  template:
    metadata:
      labels:
        app: dssd-worker
    spec:
      containers:
        - name: worker
          image: dssd-worker:dev
          imagePullPolicy: IfNotPresent
          args: ["--inner-steps=20", "--batch-size=16"]
          env:
            - name: SERVICE_NAME
              value: workers
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PEERS
              value: "worker-0 worker-1 worker-2 worker-3 worker-4"
          ports:
            - containerPort: 8000
              name: grpc
            - containerPort: 8001
              name: swim
              protocol: UDP
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
