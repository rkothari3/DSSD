apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dssd-dashboard
  template:
    metadata:
      labels:
        app: dssd-dashboard
    spec:
      containers:
        - name: dashboard
          image: dssd-worker:dev
          imagePullPolicy: IfNotPresent
          command: ["dssd-dashboard"]
          args:
            - --http-addr=0.0.0.0:8080
            - --peer=worker-0=worker-0.workers.default.svc.cluster.local:8000
            - --peer=worker-1=worker-1.workers.default.svc.cluster.local:8000
            - --peer=worker-2=worker-2.workers.default.svc.cluster.local:8000
            - --peer=worker-3=worker-3.workers.default.svc.cluster.local:8000
            - --peer=worker-4=worker-4.workers.default.svc.cluster.local:8000
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  type: NodePort
  selector:
    app: dssd-dashboard
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
