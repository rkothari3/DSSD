<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DSSD live dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1: #2a78d6; /* blue */
    --series-2: #eb6834; /* orange */
    --series-3: #1baf7a; /* aqua */
    --series-4: #eda100; /* yellow */
    --series-5: #e87ba4; /* magenta */
    --series-6: #008300; /* green */
    --series-7: #4a3aa7; /* violet */
    --series-8: #e34948; /* red */
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-serious:  #ec835a;
    --status-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 24px 8px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
  main {
    padding: 8px 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 1100px;
  }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin: 0 0 12px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .chart-wrap { position: relative; }
  svg { display: block; width: 100%; height: 320px; overflow: visible; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .axis-text { fill: var(--text-muted); font-size: 11px; }
  .series-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .end-dot { stroke: var(--surface-1); stroke-width: 2; }
  .crosshair { stroke: var(--baseline); stroke-width: 1; pointer-events: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
  .axis-caption { color: var(--text-muted); font-size: 11px; margin-top: 8px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .legend-swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text-primary);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    display: none;
    white-space: nowrap;
  }
  .tooltip-row { display: flex; align-items: center; gap: 6px; }
  .tooltip-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }
  th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .status-alive       .status-dot { background: var(--status-good); }
  .status-suspect     .status-dot { background: var(--status-warning); }
  .status-dead        .status-dot { background: var(--status-critical); }
  .status-unreachable .status-dot { background: var(--status-serious); }
  .status-unknown     .status-dot { background: var(--text-muted); }
  .worker-id { display: flex; align-items: center; gap: 8px; }
  .worker-swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>DSSD live dashboard</h1>
  <div class="subtitle" id="conn-status">connecting&hellip;</div>
</header>
<main>
  <section class="card">
    <h2>Loss vs. wall-clock time</h2>
    <div class="chart-wrap">
      <svg id="chart" viewBox="0 0 900 320" preserveAspectRatio="none"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="axis-caption">seconds since this dashboard connected &middot; hover for values</div>
  </section>
  <section class="card">
    <h2>Workers</h2>
    <table id="worker-table">
      <thead>
        <tr><th>Worker</th><th>State</th><th>Round</th><th>Loss</th></tr>
      </thead>
      <tbody id="worker-rows"></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none;">No workers reachable yet.</div>
  </section>
</main>

<script>
const SERIES_COLORS = [
  "var(--series-1)", "var(--series-2)", "var(--series-3)", "var(--series-4)",
  "var(--series-5)", "var(--series-6)", "var(--series-7)", "var(--series-8)",
];
const STATUS_CLASS = {
  ALIVE: "status-alive",
  SUSPECT: "status-suspect",
  DEAD: "status-dead",
  UNREACHABLE: "status-unreachable",
};

const history = new Map(); // worker id -> [{round, loss}]
const colorOf = new Map(); // worker id -> css color var, assigned in first-seen order
let nextColorIndex = 0;

function assignColor(id) {
  if (!colorOf.has(id)) {
    colorOf.set(id, SERIES_COLORS[nextColorIndex % SERIES_COLORS.length]);
    nextColorIndex += 1;
  }
  return colorOf.get(id);
}

function resolveVar(cssVar) {
  const name = cssVar.slice(4, -1); // "var(--series-1)" -> "--series-1"
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}

function updateTable(workers) {
  const rows = document.getElementById("worker-rows");
  const emptyMsg = document.getElementById("empty-msg");
  rows.innerHTML = "";
  if (workers.length === 0) {
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  for (const w of workers) {
    const tr = document.createElement("tr");
    const statusClass = STATUS_CLASS[w.state] || "status-unknown";
    const color = assignColor(w.id);
    tr.innerHTML = `
      <td><span class="worker-id"><span class="worker-swatch" style="background:${color}"></span>${w.id}</span></td>
      <td><span class="status ${statusClass}"><span class="status-dot"></span>${w.state}</span></td>
      <td>${w.round}</td>
      <td>${w.loss === null ? "–" : w.loss.toFixed(4)}</td>
    `;
    rows.appendChild(tr);
  }
}

let t0 = null; // wall-clock time of the first snapshot this page has seen

function updateHistory(timestamp, workers) {
  if (t0 === null) t0 = timestamp;
  const elapsed = timestamp - t0;

  for (const w of workers) {
    if (w.loss === null) continue;
    if (!history.has(w.id)) history.set(w.id, []);
    const series = history.get(w.id);
    // Round resets on leader failover (it's scoped to that leader's
    // barrier instance, not cluster-wide), so it can't be the x-axis -
    // wall-clock time is the only thing guaranteed to keep increasing.
    series.push({ t: elapsed, round: w.round, loss: w.loss });
    if (series.length > 300) series.shift();
  }
}

const svg = document.getElementById("chart");
const tooltip = document.getElementById("tooltip");
const MARGIN = { top: 10, right: 16, bottom: 24, left: 44 };
const W = 900, H = 320;

function drawChart() {
  svg.innerHTML = "";
  const legend = document.getElementById("legend");
  legend.innerHTML = "";

  const ids = [...history.keys()].filter((id) => history.get(id).length > 0);
  if (ids.length === 0) return;

  let maxLoss = 0, maxT = 1;
  for (const id of ids) {
    for (const p of history.get(id)) {
      if (p.loss > maxLoss) maxLoss = p.loss;
      if (p.t > maxT) maxT = p.t;
    }
  }
  maxLoss = maxLoss <= 0 ? 1 : maxLoss * 1.1;
  maxT = maxT <= 0 ? 1 : maxT;

  const plotW = W - MARGIN.left - MARGIN.right;
  const plotH = H - MARGIN.top - MARGIN.bottom;
  const x = (t) => MARGIN.left + (t / maxT) * plotW;
  const y = (loss) => MARGIN.top + plotH - (loss / maxLoss) * plotH;

  const svgNS = "http://www.w3.org/2000/svg";

  // gridlines (4 horizontal steps)
  for (let i = 0; i <= 4; i++) {
    const gy = MARGIN.top + (plotH * i) / 4;
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("class", "gridline");
    line.setAttribute("x1", MARGIN.left);
    line.setAttribute("x2", W - MARGIN.right);
    line.setAttribute("y1", gy);
    line.setAttribute("y2", gy);
    svg.appendChild(line);

    const label = document.createElementNS(svgNS, "text");
    label.setAttribute("class", "axis-text");
    label.setAttribute("x", MARGIN.left - 8);
    label.setAttribute("y", gy + 3);
    label.setAttribute("text-anchor", "end");
    label.textContent = (maxLoss * (1 - i / 4)).toFixed(2);
    svg.appendChild(label);
  }

  for (const id of ids) {
    const color = assignColor(id);
    const points = history.get(id);
    const d = points.map((p, i) => `${i === 0 ? "M" : "L"}${x(p.t)},${y(p.loss)}`).join(" ");

    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("class", "series-line");
    path.setAttribute("d", d);
    path.setAttribute("stroke", color);
    svg.appendChild(path);

    const last = points[points.length - 1];
    const dot = document.createElementNS(svgNS, "circle");
    dot.setAttribute("class", "end-dot");
    dot.setAttribute("cx", x(last.t));
    dot.setAttribute("cy", y(last.loss));
    dot.setAttribute("r", 4);
    dot.setAttribute("fill", color);
    svg.appendChild(dot);

    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = `<span class="legend-swatch" style="background:${color}"></span>${id}`;
    legend.appendChild(item);
  }

  svg.onmousemove = (evt) => {
    const rect = svg.getBoundingClientRect();
    const scaleX = W / rect.width;
    const mouseX = (evt.clientX - rect.left) * scaleX;
    const t = ((mouseX - MARGIN.left) / plotW) * maxT;

    const rows = [];
    for (const id of ids) {
      const points = history.get(id);
      let nearest = points[0];
      for (const p of points) {
        if (Math.abs(p.t - t) < Math.abs(nearest.t - t)) nearest = p;
      }
      rows.push({ id, color: resolveVar(assignColor(id)), loss: nearest.loss, round: nearest.round, t: nearest.t });
    }
    if (rows.length === 0) return;

    tooltip.style.display = "block";
    tooltip.style.left = `${evt.clientX - rect.left + 12}px`;
    tooltip.style.top = `${evt.clientY - rect.top - 12}px`;
    tooltip.innerHTML =
      `<div style="color:var(--text-secondary);margin-bottom:4px;">+${Math.round(rows[0].t)}s</div>` +
      rows
        .map(
          (r) =>
            `<div class="tooltip-row"><span class="tooltip-dot" style="background:${r.color}"></span>${r.id}: ${r.loss.toFixed(4)}</div>`
        )
        .join("");
  };
  svg.onmouseleave = () => {
    tooltip.style.display = "none";
  };
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  const status = document.getElementById("conn-status");

  ws.onopen = () => { status.textContent = "connected"; };
  ws.onclose = () => {
    status.textContent = "disconnected — retrying…";
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    updateTable(msg.workers);
    updateHistory(msg.timestamp, msg.workers);
    drawChart();
  };
}

connect();
</script>
</body>
</html>
